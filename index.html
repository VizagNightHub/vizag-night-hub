<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vizag Night Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-surface: #131b2e;
      --bg-card: #1c2640;
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #233052;
      --danger: #ef4444;
      --success: #10b981;
      --host-badge: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    /* AUTH */
    .auth-container { width: 100%; max-width: 440px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-height: 90vh; overflow-y: auto; }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-header .logo-icon { font-size: 38px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .brand-header h1 { font-size: 24px; font-weight: 700; }
    .brand-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .form-group input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: var(--text-main); font-size: 14px; outline: none; }
    .form-group input:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn { width: 100%; background: var(--accent-gradient); color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .auth-toggle { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 16px; }
    .auth-toggle a { color: var(--accent); text-decoration: none; font-weight: 600; cursor: pointer; }

    /* APP LAYOUT */
    .app-container { width: 100vw; height: 100vh; display: none; grid-template-columns: 320px 1fr; background: var(--bg-main); }
    .sidebar { background: var(--bg-surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .group-info h2 { font-size: 18px; font-weight: 700; }
    .group-info span { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .sidebar-actions { display: flex; gap: 6px; }
    .sidebar-actions button { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px; border-radius: 8px; cursor: pointer; }
    .members-section { flex: 1; overflow-y: auto; padding: 16px; }
    .members-section h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; }
    .member-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; margin-bottom: 6px; background: rgba(255,255,255,0.02); }
    .member-meta { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; flex-shrink: 0; }
    .member-username { font-size: 13px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .member-subtext { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .badge-host { background: rgba(245, 158, 11, 0.15); color: var(--host-badge); border: 1px solid var(--host-badge); font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 4px; }
    .btn-kick { background: transparent; border: none; color: var(--danger); cursor: pointer; font-size: 13px; }
    .user-footer { padding: 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }

    /* CHAT */
    .chat-area { display: flex; flex-direction: column; height: 100vh; background: var(--bg-main); }
    .chat-header { padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; }
    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .message-bubble { max-width: 65%; display: flex; flex-direction: column; }
    .message-bubble.me { align-self: flex-end; }
    .message-bubble.me .bubble-content { background: var(--accent); color: #fff; border-radius: 16px 16px 2px 16px; }
    .message-bubble.other { align-self: flex-start; }
    .message-bubble.other .bubble-content { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px 16px 16px 2px; }
    .bubble-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .bubble-content { padding: 12px 16px; word-break: break-word; }
    .bubble-content img, .bubble-content video { max-width: 100%; max-height: 280px; border-radius: 8px; margin-top: 6px; display: block; }
    .bubble-actions { margin-top: 4px; display: flex; justify-content: flex-end; }
    .btn-del-msg { background: transparent; border: none; color: var(--danger); font-size: 11px; cursor: pointer; }

    /* INPUT BAR */
    .chat-input-bar { padding: 16px 24px; background: var(--bg-surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .btn-icon { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); width: 40px; height: 40px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .chat-input-bar input[type="text"] { flex: 1; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; color: #fff; outline: none; }

    /* MODALS */
    .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; text-align: center; }
    #qrcode { background: #fff; padding: 12px; border-radius: 10px; display: inline-block; margin: 16px 0; }
  </style>
</head>
<body>

  <div class="auth-container" id="authBox">
    <div class="brand-header">
      <div class="logo-icon"><i class="fa-solid fa-moon"></i></div>
      <h1>Vizag Night Hub</h1>
      <p id="authSubtitle">Live Real-Time Cloud Group (18+)</p>
    </div>

    <div id="loginSection">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="name@domain.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="handleLogin()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <div class="auth-toggle">New to Hub? <a onclick="toggleAuthMode('register')">Register with Email OTP (18+)</a></div>
    </div>

    <div id="registerSection" style="display: none;">
      <div class="form-group">
        <label>Enter Email Address</label>
        <input type="email" id="regEmail" placeholder="name@domain.com" />
      </div>
      <button class="btn" onclick="sendOtp()"><i class="fa-solid fa-paper-plane"></i> Send OTP</button>
      <div class="auth-toggle">Already registered? <a onclick="toggleAuthMode('login')">Sign In</a></div>
    </div>

    <div id="otpSection" style="display: none;">
      <div class="form-group">
        <label>Enter 6-Digit OTP</label>
        <input type="text" id="enteredOtp" placeholder="123456" maxlength="6" />
      </div>
      <div class="form-group">
        <label>Choose Username</label>
        <input type="text" id="regUsername" placeholder="e.g., Alex_Vizag" />
      </div>
      <div class="form-group">
        <label>Date of Birth (18+ Only - Locked after registration)</label>
        <input type="date" id="regDob" />
      </div>
      <div class="form-group">
        <label>Create New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="verifyAndSetPassword()"><i class="fa-solid fa-check"></i> Complete Registration</button>
    </div>
  </div>

  <div class="app-container" id="appBox">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="group-info">
          <h2>Vizag Night Hub</h2>
          <span><i class="fa-solid fa-circle" style="font-size: 8px;"></i> 18+ Active</span>
        </div>
        <div class="sidebar-actions">
          <button onclick="openProfileModal()" title="Profile Settings"><i class="fa-solid fa-user-gear"></i></button>
          <button onclick="openInviteModal()" title="Invite Link & QR Code"><i class="fa-solid fa-qrcode"></i></button>
        </div>
      </div>

      <div class="members-section">
        <h3>Live Members</h3>
        <div id="membersList"></div>
      </div>

      <div class="user-footer">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="avatar" id="myAvatar">U</div>
          <div>
            <div id="myUsernameLabel" style="font-size: 13px; font-weight:600;"></div>
            <div id="myRoleLabel" style="font-size: 11px; color: var(--text-muted);"></div>
          </div>
        </div>
        <button class="btn-kick" onclick="logout()" title="Logout"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <div>
          <strong style="font-size:16px;">Vizag Night Feed</strong>
          <p style="font-size: 12px; color: var(--text-muted);">Synchronized private room</p>
        </div>
        <div id="hostPrivilegeNotice" style="display:none; font-size:12px; color:var(--host-badge);">
          <i class="fa-solid fa-shield-halved"></i> Host Admin Active
        </div>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="chat-input-bar">
        <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none;" onchange="handleFileUpload(event)" />
        <button class="btn-icon" onclick="document.getElementById('mediaUpload').click()" title="Share Photo/Video"><i class="fa-solid fa-photo-film"></i></button>
        <button class="btn-icon" onclick="shareLiveLocation()" title="Share Live Location"><i class="fa-solid fa-location-crosshairs"></i></button>
        <input type="text" id="chatInput" placeholder="Type a message in Vizag Night Hub..." onkeydown="if(event.key==='Enter') sendTextMessage()" />
        <button class="btn" style="width: auto; padding: 12px 20px;" onclick="sendTextMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <div class="modal" id="profileModal">
    <div class="modal-content" style="text-align: left;">
      <h3 style="text-align:center; margin-bottom: 16px;"><i class="fa-solid fa-id-
